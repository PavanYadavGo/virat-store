<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="E0xsX0ps_GNnl8A_BnAzwt1906QkJjxCExmgl1qgS9I" />

    <title>Virat Sports | Cricket & Performance Sportswear</title>
    <meta
      name="description"
      content="Shop cricket-inspired sportswear at Virat. Explore cricket jerseys, sports T-shirts, shorts and tracksuits designed for everyday comfort and performance."
    />
    <link rel="canonical" href="https://www.viratsports.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#080808" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virat Sports" />
    <meta property="og:title" content="Virat Sports | Cricket & Performance Sportswear" />
    <meta
      property="og:description"
      content="Shop cricket-inspired sportswear at Virat. Explore cricket jerseys, sports T-shirts, shorts and tracksuits designed for everyday comfort and performance."
    />
    <meta property="og:url" content="https://www.viratsports.in/" />
    <meta property="og:image" content="https://www.viratsports.in/images/hero/header-1.webp" />
    <meta property="og:image:width" content="1808" />
    <meta property="og:image:height" content="870" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Virat Sports | Cricket & Performance Sportswear" />
    <meta
      name="twitter:description"
      content="Shop cricket-inspired sportswear at Virat. Explore cricket jerseys, sports T-shirts, shorts and tracksuits designed for everyday comfort and performance."
    />
    <meta name="twitter:image" content="https://www.viratsports.in/images/hero/header-1.webp" />

    <!-- Preload LCP Candidate Hero Banner -->
    <link
      rel="preload"
      as="image"
      href="/images/hero/header-1.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Structured Data: Organization & WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.viratsports.in/#organization",
            "name": "Virat Sports",
            "url": "https://www.viratsports.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.viratsports.in/favicon.svg"
            },
            "description": "Premium cricket-inspired performance sportswear and athletic apparel engineered for training, matches, and everyday athletic living.",
            "sameAs": [
              "https://www.instagram.com/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.viratsports.in/#website",
            "url": "https://www.viratsports.in/",
            "name": "Virat Sports",
            "publisher": {
              "@id": "https://www.viratsports.in/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://www.viratsports.in/products?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
